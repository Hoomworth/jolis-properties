<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jolis Properties - Admin Portal</title>
  <style>
    :root {
      --primary-color: #1a659e;
      --dark-color: #0b0f19;
      --white: #ffffff;
      --font-main: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    body {
      margin: 0;
      padding: 0;
      background: var(--dark-color);
      color: var(--white);
      font-family: var(--font-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .loader-container {
      max-width: 400px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--primary-color);
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto 24px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 12px;
      font-weight: 600;
    }

    p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.6;
      margin: 0 0 24px;
    }

    .btn {
      display: inline-block;
      background: var(--primary-color);
      color: var(--white);
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(26, 101, 158, 0.3);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Redirect to the Sanity Studio URL after 2.5 seconds
      setTimeout(() => {
        window.location.href = "https://admin.jolisproperties.com.ng";
      }, 2500);
    });
  </script>
</head>
<body>
  <div class="loader-container">
    <div class="spinner"></div>
    <h1>Connecting to Admin Dashboard</h1>
    <p>Redirecting you to the secure Jolis Properties Sanity CMS Portal...</p>
    <a href="https://admin.jolisproperties.com.ng" class="btn">Launch Dashboard Manually</a>
  </div>
</body>
</html>
